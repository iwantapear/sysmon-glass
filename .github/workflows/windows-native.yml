# Builds the Windows-native C++ implementation on a clean runner. Unlike the
# Linux workflow this does not launch a GUI (desktop underlay needs a real shell).
name: windows-native

on:
  push:
    branches: [master]
    paths: ['cpp/app/**', '.github/workflows/windows-native.yml']
  pull_request:
    paths: ['cpp/app/**', '.github/workflows/windows-native.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: binutils mingw-w64-ucrt-x86_64-gcc

      - name: Compile native executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location cpp/app
          # Compile without the optional icon resource on CI: resource tool names
          # differ between MSYS2 distributions; app falls back to a stock icon.
          # setup-msys2 uses D:\msys64 on GitHub-hosted runners; local builds
          # commonly use C:\msys64. Resolve the root instead of hardcoding it.
          # setup-msys2 may install under the hosted tool cache rather than C:\msys64.
          $msysRoot = @('C:\tools\msys64','D:\tools\msys64','C:\msys64','D:\msys64') |
            Where-Object { Test-Path (Join-Path $_ 'ucrt64\bin\g++.exe') } | Select-Object -First 1
          if(-not $msysRoot){ throw 'g++ not found in any standard MSYS2 location' }
          $gpp = Join-Path $msysRoot 'ucrt64\bin\g++.exe'
          if(-not (Test-Path $gpp)){ throw "g++ not found under $msysRoot" }
          & $gpp -std=c++20 -O2 -mwindows -DUNICODE -D_UNICODE `
            -o sysmon.exe app.cpp `
            -ld2d1 -ldwrite -ldwmapi -lcomctl32 -lole32 -loleaut32 -luuid `
            -luiautomationcore -liphlpapi -lshell32 -lgdi32 -luser32
          if($LASTEXITCODE){ throw 'native build failed' }
          Get-Item sysmon.exe | Select-Object FullName,Length
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: SysMon.Glass-native-win-x64
          path: cpp/app/sysmon.exe
          if-no-files-found: error
